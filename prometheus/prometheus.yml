global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: model-server
    metrics_path: /metrics
    static_configs:
      - targets: ["model-server:5001"]

  # Airflow exposes metrics via statsd-exporter in a later phase.
  # Placeholder job so Prometheus knows the target exists.
  - job_name: airflow
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: /health  # replaced when statsd-exporter lands
