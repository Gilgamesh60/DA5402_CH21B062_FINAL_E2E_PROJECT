global:
  scrape_interval: 5s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: drift
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["drift-exporter:9101"]

  # model-server doesn't expose /metrics natively (mlflow models serve).
  # Liveness is inferred via the api /ready probe and the `up` metric
  # from the `api` job.
