# DVC pipeline — the DAG that doubles as our CI pipeline.

stages:
  ingest:
    cmd: python3 -m ssa_ingestion.pipeline
    deps:
      - src/ssa_ingestion
      - data/seed/seed_corpus.jsonl
    params:
      - ingestion
    outs:
      - data/raw/records.parquet
    metrics:
      - artifacts/ingestion_report.json:
          cache: false

  validate:
    cmd: python3 -m ssa_ingestion.validation
    deps:
      - data/raw/records.parquet
      - src/ssa_ingestion/validation.py
      - src/ssa_ingestion/schemas.py
    params:
      - validation
    outs:
      - data/interim/validated.parquet
    metrics:
      - artifacts/validation_report.json:
          cache: false

  eda_baselines:
    cmd: python3 -m ssa_ingestion.eda
    deps:
      - data/interim/validated.parquet
      - src/ssa_ingestion/eda.py
    outs:
      - artifacts/baselines.json:
          cache: false
      - artifacts/eda_summary.md:
          cache: false

  features:
    cmd: python3 -m ssa_features.pipeline
    deps:
      - data/interim/validated.parquet
      - src/ssa_features
    params:
      - features
      - training.test_size
      - training.val_size
      - training.random_seed
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - artifacts/vectorizer.joblib
    metrics:
      - artifacts/feature_report.json:
          cache: false

  train:
    cmd: python3 -m ssa_model.train
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - artifacts/vectorizer.joblib
      - src/ssa_model
    params:
      - training
      - registry.model_name
    outs:
      - artifacts/model_uri.txt:
          cache: false
    metrics:
      - artifacts/train_metrics.json:
          cache: false

  evaluate:
    cmd: python3 -m ssa_model.evaluate
    deps:
      - data/processed/test.parquet
      - artifacts/model_uri.txt
      - src/ssa_model/evaluate.py
      - src/ssa_model/metrics.py
      - src/ssa_model/registry.py
    params:
      - evaluation
      - registry
    metrics:
      - artifacts/eval_metrics.json:
          cache: false
      - artifacts/promotion_decision.json:
          cache: false

  drift:
    cmd: python3 -m ssa_monitoring.drift
    deps:
      - data/interim/validated.parquet
      - artifacts/baselines.json
      - src/ssa_monitoring/drift.py
    params:
      - monitoring.drift
    outs:
      - artifacts/drift_metrics.prom:
          cache: false
    metrics:
      - artifacts/drift_report.json:
          cache: false
