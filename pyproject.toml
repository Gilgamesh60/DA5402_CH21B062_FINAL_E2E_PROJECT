[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-sentiment-mlops"
version = "0.1.0"
description = "End-to-end stock sentiment analysis with MLOps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Student" }]

dependencies = [
    # Core
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # API
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "httpx>=0.26",
    # Data / ML
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    # MLOps
    "mlflow>=2.10",
    "dvc[all]>=3.40",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "black>=24.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "isort>=5.13",
    "pre-commit>=3.6",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
ingestion = [
    "requests>=2.31",
    "feedparser>=6.0",
    "praw>=7.7",
    "beautifulsoup4>=4.12",
]
model = [
    "torch>=2.2",
    "transformers>=4.38",
    "datasets>=2.17",
    "accelerate>=0.27",
]
airflow = [
    "apache-airflow>=2.8",
]

# Two independent, installable sub-packages keep feature engineering
# logic versioned separately from model logic — a hard MLOps requirement.
[tool.setuptools.packages.find]
where = ["src"]
include = ["ssa_*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET"]
ignore = ["E501"]  # line length handled by black

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-report=xml"
markers = [
    "unit: fast unit tests",
    "integration: integration tests requiring services",
    "contract: API contract tests against OpenAPI spec",
]
