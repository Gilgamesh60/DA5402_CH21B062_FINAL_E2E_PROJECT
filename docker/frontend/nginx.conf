server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static files: serve normally. SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to the API. The frontend reads VITE_API_BASE_URL at runtime
    # (via /config.js), default `/api`. Keeps the browser free of CORS
    # and hides the backend topology behind a single origin.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache busting for the HTML entry and config — always fresh.
    location ~* ^/(index\.html|config\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
