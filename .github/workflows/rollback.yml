name: Model rollback

# Manual-trigger only. Promotes `target_version` of the registered model
# to Production, archives whatever was there. Dry-run default prevents
# accidental promotions.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Target version to promote to Production (e.g. 3)"
        required: true
        type: string
      mlflow_uri:
        description: "MLflow tracking URI (default: http://localhost:5000)"
        required: false
        default: "http://localhost:5000"
        type: string
      dry_run:
        description: "Dry run (report only, no transition)"
        required: false
        default: true
        type: boolean

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,model]"

      - name: Preflight — list versions
        env:
          MLFLOW_TRACKING_URI: ${{ inputs.mlflow_uri }}
        run: |
          python - <<'PY'
          import os, json
          from mlflow.tracking import MlflowClient
          client = MlflowClient(tracking_uri=os.environ["MLFLOW_TRACKING_URI"])
          mvs = client.search_model_versions("name='stock-sentiment'")
          print(json.dumps(
              [{"version": v.version, "stage": v.current_stage} for v in mvs],
              indent=2,
          ))
          PY

      - name: Rollback
        if: ${{ !inputs.dry_run }}
        env:
          MLFLOW_TRACKING_URI: ${{ inputs.mlflow_uri }}
          TARGET: ${{ inputs.target_version }}
        run: |
          python - <<'PY'
          import os
          from ssa_model.registry import rollback
          prev, new = rollback("stock-sentiment", os.environ["TARGET"])
          print(f"rolled back: previous=v{prev.version} ({prev.stage}) -> new=v{new.version} ({new.stage})")
          PY

      - name: Summary
        run: |
          {
            echo "### Rollback summary"
            echo ""
            echo "- target version: **${{ inputs.target_version }}**"
            echo "- mlflow URI: \`${{ inputs.mlflow_uri }}\`"
            echo "- dry run: **${{ inputs.dry_run }}**"
            echo ""
            echo "After rollback, restart \`model-server\` on the target host:"
            echo '```bash'
            echo 'docker compose restart model-server'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
