global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Drift-related alerts trigger retraining via the Airflow REST API.
    - receiver: airflow-retrain
      matchers:
        - severity="warning"
        - alertname=~"FeatureDrift.*|PredictionClassRatioAnomaly"
      continue: true

receivers:
  - name: default
    # Stub receiver that does nothing - keeps Alertmanager happy.
    webhook_configs:
      - url: http://localhost:1/null
        send_resolved: false

  - name: airflow-retrain
    webhook_configs:
      # Airflow's stable REST API endpoint for triggering a DAG run.
      # basic_auth: admin/admin is the default user created in compose.
      - url: http://airflow-webserver:8080/api/v1/dags/ssa_retraining/dagRuns
        send_resolved: false
        http_config:
          basic_auth:
            username: admin
            password: admin
        # Alertmanager posts its full alert payload; Airflow ignores unknown
        # keys and creates the DAG run from the base URL.

inhibit_rules: []
